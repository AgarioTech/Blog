version: '3.9'

services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1812
      POSTGRES_DB: blog_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:latest
  web:
    build: .
    restart: always
    command: >
      sh -c "cd src && 
             python manage.py makemigrations &&
             python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000"
    volumes:
      - .:/blog-app
      - static_volume:/blog-app/src/staticfiles
      - ./media:/blog-app/media 
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.base
      DB_NAME: blog_db
      DB_USER: postgres
      DB_PASSWORD: 1812
      DB_HOST: db
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
  nginx:
    image: nginx:latest
    restart: always
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/blog-app/src/staticfiles
      - ./media:/blog-app/media
      - /etc/letsencrypt:/etc/letsencrypt
    ports:
      - "80:80"
      - "443:443"
    depends_on: 
      - web
volumes:
  postgres_data:
  static_volume:
